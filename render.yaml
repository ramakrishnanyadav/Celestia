services:
  - type: web
    name: celestia-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PYTHONPATH
        value: .
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: celestia-db
          property: connectionString

databases:
  - name: celestia-db
    databaseName: celestia
    user: celestia_admin
    plan: free
