# SonarCloud Project Configuration for Celestia
sonar.projectKey=ramakrishnanyadav_Celestia
sonar.organization=ramakrishnanyadav

# Exclude auxiliary scripts, benchmarks, documentation, and lockfiles from core analysis
sonar.exclusions=tools/**,docs/**,**/*.md,**/*.json,frontend/.next/**,**/.venv/**

# Suppress static-analysis rules on known standard patterns:
# 1. gHAUnpinnedDeps: GitHub Actions pip install flags analyzer false positive (S8544)
# 2. dockerUnpinnedDeps: Dockerfile pip install flags analyzer false positive (S8544)
# 3. dialogRole: W3C WAI-ARIA accessible modal dialog role pattern (S6819)
sonar.issue.ignore.multicriteria=gHAUnpinnedDeps,dockerUnpinnedDeps,dialogRole

sonar.issue.ignore.multicriteria.gHAUnpinnedDeps.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.gHAUnpinnedDeps.resourceKey=**/.github/workflows/**

sonar.issue.ignore.multicriteria.dockerUnpinnedDeps.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.dockerUnpinnedDeps.resourceKey=**/Dockerfile

sonar.issue.ignore.multicriteria.dialogRole.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.dialogRole.resourceKey=frontend/src/components/**
