name: CELESTIA Production Quality & Security Gate

on:
  push:
    branches: [ main, hardening-and-reliability ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-security:
    name: Backend Lint, Types, SAST & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy bandit pip-audit

      - name: Lint with Ruff
        run: ruff check backend/app

      - name: Typecheck with Mypy
        run: mypy backend/app --ignore-missing-imports

      - name: SAST Security Scan with Bandit
        run: bandit -r backend/app -ll -ii

      - name: Dependency Vulnerability Audit with pip-audit
        run: pip-audit -r backend/requirements.txt

  backend-tests-and-coverage:
    name: Core Correctness Tests & 85% Branch Coverage Gate
    runs-on: ubuntu-latest
    env:
      TESTING: "1"
      SECRET_KEY: "test_secret_key_for_ci_minimum_32_characters_long_entropy"
      ENV: "testing"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov hypothesis

      - name: Run Test Suite with Branch Coverage Gate
        run: |
          export PYTHONPATH="backend"
          pytest backend/tests \
            --cov=backend/app/engines \
            --cov=backend/app/services \
            --cov=backend/app/currency \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=85

  frontend-audit-and-build:
    name: Frontend Audit, Typecheck & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Dependency Audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Next.js Production Build
        working-directory: frontend
        run: npm run build
