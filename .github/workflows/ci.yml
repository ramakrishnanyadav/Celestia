name: CELESTIA Production Quality, Security & Testing Gate

on:
  push:
    branches: [ main, hardening-and-reliability ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-security:
    name: Backend Lint, Types, SAST & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check backend/app

      - name: Typecheck with Mypy
        run: mypy backend/app --ignore-missing-imports

      - name: SAST Security Scan with Bandit
        run: bandit -r backend/app -ll -ii

      - name: Dependency Vulnerability Audit with pip-audit
        run: pip-audit -r backend/requirements.txt

  backend-tests-and-coverage:
    name: Backend Pytest & 90% Branch Coverage Gate
    runs-on: ubuntu-latest
    env:
      TESTING: "1"
      SECRET_KEY: "test_secret_key_for_ci_minimum_32_characters_long_entropy"
      ENV: "testing"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Test Suite with >=90% Branch Coverage Gate
        run: |
          export PYTHONPATH="backend"
          pytest backend/tests \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90

  frontend-quality-and-tests:
    name: Frontend Unit Tests (Vitest >=85%), Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: TypeScript Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Vitest Unit & Component Coverage Gate (>=85%)
        working-directory: frontend
        run: npm run test:coverage

      - name: OpenAPI Contract Drift Check
        run: npx openapi-typescript docs/openapi.json --export-type

      - name: Next.js Production Build
        working-directory: frontend
        run: npm run build

  e2e-and-a11y:
    name: Cross-Browser E2E (Chromium/Firefox/WebKit) & Axe-Core Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          pip install --only-binary :all: -r backend/requirements.txt -r backend/requirements-dev.txt
          playwright install --with-deps chromium firefox webkit
          cd frontend && npm ci --legacy-peer-deps --ignore-scripts && npm run build

      - name: Start Background Application Servers
        run: |
          export PYTHONPATH="backend"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          cd frontend && npm run start &
          sleep 6

      - name: Run Playwright E2E & Axe-core A11y Verification
        run: |
          python tools/run_e2e_and_a11y_suite.py

  secret-scan:
    name: Secret Detection with Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
