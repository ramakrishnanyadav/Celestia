[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    "node_modules",
    "frontend",
    ".venv",
    "backend/alembic",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # function call in default argument (FastAPI Depends)
    "ARG001", # unused function argument (FastAPI dependency injection, mock handlers)
    "ARG002", # unused method argument
    "ARG003", # unused class method argument
    "ARG004", # unused static method argument
    "PTH",    # pathlib preference
    "RUF012", # mutable class attribute
    "RUF046", # cast to int
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
disallow_subclassing_any = false
ignore_missing_imports = true
disable_error_code = ["arg-type", "assignment", "index", "misc", "operator", "var-annotated", "type-arg", "no-any-return"]
exclude = [
    "backend/alembic/",
    "tools/",
    "frontend/",
]

[[tool.mypy.overrides]]
module = "app.models"
ignore_errors = true
